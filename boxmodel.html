<!DOCTYPE html>
<html>
    <head>
        <title>CSS Box Model</title>
        <style>
            body { margin: 0; font-family: Arial, sans-serif; }
            
            /*width & height*/
            .box1 { width:300px; height:150px; background-color: lightblue; }

            /*padding*/
            .box2 { width: 250px; padding: 20px; background-color: lightgreen; }

            /*Margin*/
            .box4 { width: 250px; margin: 20px; background-color: lightpink; }

            /*Border*/
            .box6 {
                width: 250px;
                padding: 20px;
                border: 3px solid black;
            }

            /*Border Radius*/
            .box9 {
                width: 200px;
                height: 100px;
                border: 2px solid green;
                border-radius: 20px;
            }

            /*Overflow*/
            .box10 {
                width: 250px;
                height: 80px;
                border: 2px solid black;
                overflow: auto;
            }
        </style>
    </head>
    <body>
        <div class="box1">Width and Height Example</div>
        <div class="box2">Padding Example</div>
        <div class="box4">Margin Example</div>
        <div class="box6">Border Example</div>
        <div class="box9">Border Radius Example</div>
        <div class="box10">
            This is a long content inside a small box.
            Overflow controls how the extra content is displayed.
        </div>
    </body>
</html>
